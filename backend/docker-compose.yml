services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-salary-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: acme_salary
    volumes:
      - acme_salary_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme_salary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  acme_salary_pgdata:
